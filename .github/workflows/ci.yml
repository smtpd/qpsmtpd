name: CI Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:

  test:
    strategy:
      matrix:
        perl-version:
          - "5.26"
          - "5.38"
      fail-fast: false
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          fetch-tags: true
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
      - run: cpanm --installdeps -n .
      # Optional plugin modules. Their tests skip when the module is absent, so
      # an upstream release that drops support for a perl we still target must
      # not fail the build.
      - run: cpanm -n Mail::SPF Mail::DMARC GeoIP2 ClamAV::Client Redis
        continue-on-error: true
      - run: prove -lv t
