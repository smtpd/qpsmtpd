name: Coveralls

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    # Devel::Cover::Report::Coveralls 1.0 requires a repo token, and accepts
    # the workflow's. A failed upload doesn't fail the build.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COVERALLS_NO_FAIL: 1
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 10
        fetch-tags: true

    - name: Install Perl
      uses: shogo82148/actions-setup-perl@v1
      with:
        perl-version: 5.38

    - run: cpanm --installdeps -n -f Mail::SPF Mail::DMARC GeoIP2
    - run: cpanm -n Devel::Cover::Report::Coveralls
    - run: cpanm --installdeps -n -f ClamAV::Client Redis Time::TAI64
    - run: cpanm --installdeps -n -f .

    - name: Run tests with coverage
      env:
        HARNESS_PERL_SWITCHES: '-MDevel::Cover=+ignore,^t/'
      run: prove -lrv t

    - name: Report to Coveralls
      run: cover -report coveralls
