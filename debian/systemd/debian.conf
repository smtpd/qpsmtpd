# Debian adjustments to the upstream qpsmtpd.service, which is written for a
# git checkout in /home/smtpd/qpsmtpd.  Everything not set here comes from
# upstream unchanged.

[Unit]
Documentation=man:qpsmtpd-forkserver(8) man:qpsmtpd-prefork(8)
After=nss-lookup.target remote-fs.target
After=clamav-daemon.service spamassassin.service

[Service]
User=qpsmtpd
WorkingDirectory=/var/spool/qpsmtpd

# Skipped, not failed, unless qpsmtpd is enabled via 'dpkg-reconfigure
# qpsmtpd' (qpsmtpd/startup_enabled, default false).  The helper reads the
# same debconf settings as /etc/init.d/qpsmtpd: server type, port and
# listen interfaces.
ExecCondition=/usr/libexec/qpsmtpd/qpsmtpd-service condition
ExecStart=
ExecStart=/usr/libexec/qpsmtpd/qpsmtpd-service start
